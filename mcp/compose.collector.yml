services:
  collector:
    build: .
    image: disneyworld-mcp:collector
    container_name: disneyworld-history
    restart: unless-stopped
    init: true
    command: [node, src/collector.js]
    environment:
      ARCHIVE_DB: /data/history.sqlite
      ARCHIVE_BACKUP_DIR: /backups
    volumes:
      - type: bind
        source: /mnt/bulk-storage/disneyworld-history
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/docker-storage/disneyworld-history-backups
        target: /backups
        bind:
          create_host_path: false
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    pids_limit: 128
    stop_grace_period: 120s
    healthcheck:
      test: [CMD, node, -e, "const h=JSON.parse(require('fs').readFileSync('/data/health.json'));process.exit(Date.now()-Date.parse(h.checkedAt)<660000 && (h.status==='complete'||h.skipped) ? 0:1)"]
      interval: 60s
      timeout: 10s
      start_period: 120s
      retries: 2
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'
